[project]
name = "rars01-graspnet"
version = "0.1.0"
description = "Eye-in-hand RGB-D grasping pipeline for RARS01"
# Desktop development uses CPython 3.10; JetPack 7.2 / Ubuntu 24.04 ships
# CPython 3.12. Native packages (PyTorch, Pinocchio and Orbbec) are installed
# separately on Jetson because their wheels are platform and CUDA specific.
requires-python = ">=3.10,<3.13"
dependencies = [
  # Pinocchio 3.9 (reBot) requires the NumPy 2.3 ABI.
  "numpy>=2.3,<2.4",
  "PyYAML>=6",
  "opencv-contrib-python>=4.8,<5",
]

[project.optional-dependencies]
# The Orbbec wheel is platform-dependent, so it is kept separate from the
# portable calibration/math environment.
camera = ["pyorbbecsdk2>=2.0"]
robot = ["pybind11>=2.11"]
vision = [
  # Keep the verified CUDA ABI stable for locally compiled GraspNet ops.
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "ultralytics>=8.4,<8.5",
  "open3d>=0.18",
  "scipy>=1.15,<1.19",
  "transforms3d>=0.4",
  "trimesh>=4",
  "ninja>=1.11",
]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rars01_graspnet*", "drivers*", "utils*", "calibration*"]

[tool.uv]
package = true
